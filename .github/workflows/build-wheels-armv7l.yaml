name: build-wheels-armv7l

on:
  push:
    branches:
      - wheel
    tags:
      - '*'

  workflow_dispatch:

concurrency:
  group: build-wheels-armv7l-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels_armv7l:
    name: ${{ matrix.python-version }}
    # an aarch64 host executes armv7 binaries natively, so no QEMU is needed --
    # same setup as sherpa-onnx/kaldifst/kaldilm build-wheels-armv7l.yaml. Do
    # NOT move this back to ubuntu-latest + qemu: emulation is far slower and
    # flakier.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # The pinned manylinux_2_31_armv7l image ships CPython 3.9+, so cp38
        # is omitted here only; the x86_64/aarch64/win jobs still build it.
        #
        # cp313+ are omitted on armv7l as well. PyPI has no armv7l wheels for
        # numpy, so pip builds it from source inside the image, and the image
        # only has GCC 9.4. numpy 2.5.x -- the first release supporting
        # CPython 3.15 -- needs GCC >= 10.3 and fails with
        # "ERROR: Problem encountered: NumPy requires GCC >= 10.3". numpy
        # 1.26.x is pinned here (see the install steps) and it stops at
        # CPython 3.12. So armv7l covers 3.9-3.12; the x86_64/aarch64/win
        # jobs still cover 3.13-3.15.
        python-version: ["cp39", "cp310", "cp311", "cp312"]

    steps:
      - uses: actions/checkout@v7

      # see https://cibuildwheel.readthedocs.io/en/stable/changelog/
      # for a list of versions
      # cibuildwheel 4.x is needed for cp315. There is no cp38 split here
      # because this image never shipped a CPython 3.8 interpreter.
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.3
        env:
          CIBW_BUILD: "${{ matrix.python-version}}-* "
          CIBW_SKIP: "pp* *-musllinux*"
          CIBW_ARCHS: "armv7l"
          CIBW_BUILD_VERBOSITY: 3
          # cibuildwheel's default armv7l image is still experimental; pin the
          # one used by piper-phonemize, sherpa-onnx and kaldifst.
          CIBW_MANYLINUX_ARMV7L_IMAGE: quay.io/pypa/manylinux_2_31_armv7l
          # Let make use every CPU available.
          CIBW_ENVIRONMENT_LINUX: KALDI_NATIVE_IO_MAKE_ARGS="-j$(nproc)"

      - name: Display wheels
        shell: bash
        run: |
          ls -lh ./wheelhouse/

          unzip -l ./wheelhouse/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-armv7l-${{ matrix.python-version }}
          path: ./wheelhouse/*.whl

      # Same sequence as every other wheel job -- install the wheel, test it,
      # then publish -- but the install and the test have to run inside the
      # manylinux armv7l image. This aarch64 runner cannot do it directly: pip
      # rejects the armv7l platform tag, and importing a 32-bit extension needs
      # a 32-bit interpreter. The image ships the matching one at
      # /opt/python/cpXY-cpXY, which is the interpreter cibuildwheel itself
      # used, so the test exercises exactly the binary that was built.
      - name: Install the wheel
        shell: bash
        run: |
          docker run --rm \
            --user 0:0 \
            --volume ${{ github.workspace }}/wheelhouse:/wheels:ro \
            quay.io/pypa/manylinux_2_31_armv7l \
          bash -c '
            set -e
            PY=/opt/python/${{ matrix.python-version }}-${{ matrix.python-version }}/bin/python
            "$PY" -m pip install --upgrade pip

            # PyPI publishes no armv7l numpy wheels, so pip would build numpy
            # from source -- and the newest release needs GCC >= 10.3 while
            # this image has 9.4. Install numpy 1.26.x explicitly first, then
            # install our wheel with --no-deps so pip does not try to
            # re-resolve (and rebuild) numpy.
            "$PY" -m pip install "numpy==1.26.*"
            "$PY" -m pip install --no-deps /wheels/*.whl

            # Run from / so `import kaldi_native_io` cannot pick up a source tree.
            cd /
            "$PY" -c "import numpy; print(\"numpy\", numpy.__version__)"
            "$PY" -c "import kaldi_native_io; print(kaldi_native_io.__file__)"
            "$PY" -c "import kaldi_native_io; print(kaldi_native_io.__version__)"
          '

      - name: Smoke test
        shell: bash
        run: |
          docker run --rm \
            --user 0:0 \
            --volume ${{ github.workspace }}/wheelhouse:/wheels:ro \
            --volume ${{ github.workspace }}/scripts:/scripts:ro \
            quay.io/pypa/manylinux_2_31_armv7l \
          bash -c '
            set -e
            PY=/opt/python/${{ matrix.python-version }}-${{ matrix.python-version }}/bin/python
            "$PY" -m pip install --upgrade pip
            "$PY" -m pip install "numpy==1.26.*"
            "$PY" -m pip install --no-deps /wheels/*.whl

            cd /
            "$PY" /scripts/smoke_test.py
          '

      - name: Run Python tests
        shell: bash
        run: |
          docker run --rm \
            --user 0:0 \
            --volume ${{ github.workspace }}/wheelhouse:/wheels:ro \
            --volume ${{ github.workspace }}/scripts:/scripts:ro \
            --volume ${{ github.workspace }}/kaldi_native_io/python/tests:/tests:ro \
            quay.io/pypa/manylinux_2_31_armv7l \
          bash -c '
            set -e
            PY=/opt/python/${{ matrix.python-version }}-${{ matrix.python-version }}/bin/python
            "$PY" -m pip install --upgrade pip
            "$PY" -m pip install "numpy==1.26.*"
            "$PY" -m pip install --no-deps /wheels/*.whl

            # Only scripts/ is mounted at /scripts, so the tests are not
            # beside the script the way they are in a source checkout. Point
            # the runner at the mounted copy.
            export KALDI_NATIVE_IO_TESTS_DIR=/tests

            cd /
            "$PY" /scripts/run_python_tests.py
          '

      - name: Publish wheels to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install wheel twine==5.0.0 setuptools

          # twine --skip-existing first queries
          # https://pypi.python.org/pypi/<name>/json -- the deprecated
          # hostname, hardcoded as LEGACY_PYPI in twine/repository.py (same
          # in 5.0.0 and 7.x). Runner DNS for that name is occasionally
          # flaky and fails the step even though upload.pypi.org is
          # reachable. Retry so a transient lookup error cannot sink an
          # otherwise-good publish; --skip-existing makes re-runs
          # idempotent, so retrying is safe.
          for _ in 1 2 3 4 5; do
            twine upload --skip-existing ./wheelhouse/*.whl && exit 0
            echo 'twine upload failed; retrying in 15s'
            sleep 15
          done
          exit 1
