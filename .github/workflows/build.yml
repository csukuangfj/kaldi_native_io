name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm, macos-15-intel]
        python-version: ["3.8", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      # see https://github.com/microsoft/setup-msbuild
      - name: Add msbuild to PATH
        if: startsWith(matrix.os, 'windows')
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        shell: bash
        run: |
          python3 -m pip install --upgrade numpy

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -D KALDI_NATIVE_IO_BUILD_TESTS=ON -D CMAKE_BUILD_TYPE=Release .

      - name: Build kaldi_native_io for ubuntu/macos
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        run: |
          cmake --build build -j

      - name: Build kaldi_native_io for windows
        if: startsWith(matrix.os, 'windows')
        run: |
          cmake --build build --config Release

      - name: Test
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          cd build
          ctest --output-on-failure

      - name: Test
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          cd build
          ctest -C Release --output-on-failure
