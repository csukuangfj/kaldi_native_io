name: build-wheels-android

on:
  push:
    branches:
      - wheel
    tags:
      - '*'

  workflow_dispatch:

concurrency:
  group: build-wheels-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels_android:
    name: ${{ matrix.abi }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # These wheels target Termux-on-Android, not an APK. They are built
          # natively inside termux/termux-docker images (Termux clang already
          # targets bionic), so there is no Android NDK and no cross-compiling
          # toolchain involved. Same approach as sherpa-onnx and
          # piper-phonemize.
          #
          # aarch64 + arm run on an ARM host so no qemu is needed; x86_64
          # runs on the x64 host.
          - abi: aarch64
            os: ubuntu-24.04-arm
            docker: aarch64
            plat: android_24_arm64_v8a
            makejobs: "-j$(nproc)"
          - abi: arm
            os: ubuntu-24.04-arm
            docker: arm
            plat: android_24_armeabi_v7a
            # 32-bit ARM is the constrained leg: -j4 hit
            # "make[2]: *** duping jobs pipe: Bad file descriptor" part way
            # through the pybind11 sources. -j1 both halves peak memory and
            # keeps make from creating a jobserver at all.
            makejobs: "-j1"
          - abi: x86_64
            os: ubuntu-latest
            docker: x86_64
            plat: android_24_x86_64
            makejobs: "-j$(nproc)"

    steps:
      - uses: actions/checkout@v7

      # The container runs as root and writes into the mounted workspace.
      - name: Prepare workspace for root-in-container build
        shell: bash
        run: |
          mkdir -p build dist wheelhouse
          chmod -R a+w "${{ github.workspace }}"

      - name: Build wheel inside termux
        shell: bash
        run: |
          docker run --rm \
            --user 0:0 \
            --volume ${{ github.workspace }}/:/kaldi_native_io \
            termux/termux-docker:${{ matrix.docker }} \
          bash -c '
            set -e
            apt update -y
            apt install -y cmake make git python python-pip clang libc++
            # Package names vary between image snapshots.
            apt install -y android-liblog || true
            apt install -y libandroid-dev || true
            apt install -y android-libandroid || true

            pip install --upgrade pip setuptools wheel

            # termux "python" is unpinned, so the wheel tag is whatever CPython
            # the image ships today. Log it rather than assume.
            python3 -VV
            python3 -c "import sysconfig; print(sysconfig.get_platform())"

            cd /kaldi_native_io
            # Per-ABI parallelism -- see the matrix comments above. The
            # shell below expands $(nproc) when the value contains it.
            export KALDI_NATIVE_IO_MAKE_ARGS="${{ matrix.makejobs }}"

            # --plat-name is load-bearing: Termux CPython reports linux-aarch64
            # (etc.), so without it the wheel is mis-tagged linux_* and pip
            # refuses it on Android. API level 24 is encoded in the tag; it is
            # the oldest level with RUNPATH support and covers ~99% of devices.
            python3 setup.py bdist_wheel --plat-name=${{ matrix.plat }}

            ls -lh dist
          '

      - name: Collect wheels
        shell: bash
        run: |
          # setup.py also rewrites kaldi_native_io/python/kaldi_native_io/__init__.py,
          # so that directory is dirty in addition to build/ and dist/.
          sudo chown -R $USER ./build ./dist ./kaldi_native_io ./wheelhouse
          cp -v ./dist/*.whl ./wheelhouse

      - name: Display wheels
        shell: bash
        run: |
          ls -lh ./wheelhouse/

          echo "---"
          unzip -l ./wheelhouse/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-android-${{ matrix.abi }}
          path: ./wheelhouse/*.whl

      # The plat-name trick is the one part of this build that a green
      # compile does not prove; actually import it on the target ABI and
      # exercise the table I/O before anything is published. This gates the
      # publish step below on purpose -- a wheel that cannot load must not
      # reach PyPI.
      #
      # numpy: PyPI publishes no android_* wheels for numpy, so `pip install
      # numpy` would fall back to a source build and fail. Termux ships numpy
      # as an apt package instead, so install that and use --no-deps when
      # installing our wheel -- otherwise pip re-resolves numpy from PyPI and
      # the install dies before any test runs.
      - name: Smoke test
        shell: bash
        run: |
          chmod -R a+w "${{ github.workspace }}" || true

          # termux has no /tmp and its / is not writable even as root, so
          # create a scratch dir on the host and mount it into the container.
          mkdir -p "${{ github.workspace }}/smoke-dir"
          chmod a+rwx "${{ github.workspace }}/smoke-dir"

          docker run --rm \
            --user 0:0 \
            --volume ${{ github.workspace }}/wheelhouse:/wheels:ro \
            --volume ${{ github.workspace }}/scripts:/scripts:ro \
            --volume ${{ github.workspace }}/smoke-dir:/smoke:rw \
            termux/termux-docker:${{ matrix.docker }} \
          bash -c '
            set -e
            apt update -y
            apt install -y python python-pip libc++ clang python-numpy
            apt install -y android-liblog || true
            apt install -y libandroid-dev || true
            apt install -y android-libandroid || true

            pip install --upgrade pip setuptools wheel
            pip install --no-deps /wheels/kaldi_native_io-*.whl

            export TMPDIR=/smoke

            # cd /smoke so `import kaldi_native_io` cannot pick up a source
            # tree. sys.path[0] is the directory of the script itself
            # (/scripts), which holds the two scripts and no package.
            cd /smoke
            python3 -c "import numpy; print(\"numpy\", numpy.__version__)"
            python3 /scripts/smoke_test.py
          '

      - name: Run Python tests
        shell: bash
        run: |
          chmod -R a+w "${{ github.workspace }}" || true

          # termux has no /tmp and its / is not writable even as root, so
          # create a scratch dir on the host and mount it into the container.
          mkdir -p "${{ github.workspace }}/smoke-dir"
          chmod a+rwx "${{ github.workspace }}/smoke-dir"

          docker run --rm \
            --user 0:0 \
            --volume ${{ github.workspace }}/wheelhouse:/wheels:ro \
            --volume ${{ github.workspace }}/scripts:/scripts:ro \
            --volume ${{ github.workspace }}/kaldi_native_io/python/tests:/tests:ro \
            --volume ${{ github.workspace }}/smoke-dir:/smoke:rw \
            termux/termux-docker:${{ matrix.docker }} \
          bash -c '
            set -e
            apt update -y
            apt install -y python python-pip libc++ clang python-numpy
            apt install -y android-liblog || true
            apt install -y libandroid-dev || true
            apt install -y android-libandroid || true

            pip install --upgrade pip setuptools wheel
            pip install --no-deps /wheels/kaldi_native_io-*.whl

            export TMPDIR=/smoke
            # Only scripts/ is mounted at /scripts, so the tests are not
            # beside the script the way they are in a source checkout. Point
            # the runner at the mounted copy.
            export KALDI_NATIVE_IO_TESTS_DIR=/tests

            cd /smoke
            python3 /scripts/run_python_tests.py
          '

      - name: Publish wheels to PyPI
        shell: bash
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install wheel twine==5.0.0 setuptools

          for _ in 1 2 3 4 5; do
            twine upload --skip-existing ./wheelhouse/*.whl && exit 0
            echo 'twine upload failed; retrying in 15s'
            sleep 15
          done
          exit 1
